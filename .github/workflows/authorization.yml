name: Staging authorization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-authorization
  cancel-in-progress: false

jobs:
  boundaries:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-eval.txt
      - run: python -m pip install -r scripts/requirements-eval.txt
      - name: Test real app, RLS, Storage and RPC boundaries
        env:
          AUTHZ_APP_URL: ${{ vars.AUTHZ_APP_URL }}
          AUTHZ_SUPABASE_URL: ${{ vars.AUTHZ_SUPABASE_URL }}
          AUTHZ_SUPABASE_ANON_KEY: ${{ secrets.AUTHZ_SUPABASE_ANON_KEY }}
          AUTHZ_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTHZ_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/authz_check.py
