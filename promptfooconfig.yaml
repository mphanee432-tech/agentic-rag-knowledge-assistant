description: "RAG Knowledge Assistant - 50-Row Strict Citation Benchmark"
prompts: ["{{query}}"]

evaluateOptions:
  maxConcurrency: 1
  delay: 8000 # 8-second pause between tests (~7.5 RPM) to eliminate rolling rate-limit dropouts

providers:
  - id: "http://127.0.0.1:3000/api/chat"
    label: "prompt-v2-strict-citations"
    config:
      method: "POST"
      headers:
        Content-Type: "application/json"
        x-eval-mode: "true"
        Authorization: "Bearer {{env.EVAL_ACCESS_TOKEN}}"
      body:
        projectId: "{{projectId}}"
        query: "{{query}}"
        promptVariant: "strict"
        stream: false
      timeoutMs: 90000
      transformResponse: "JSON.stringify(json)"

defaultTest:
  options:
    provider:
      id: "google:gemini-3.1-flash-lite"
      config:
        apiKey: "{{env.EVAL_GEMINI_API_KEY}}"

tests: ".promptfoo/golden-tests.json"
